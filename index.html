<html>
<head>
    <title>ABC College Portal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            height: 15%;
            background-color: #002d62;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #000;
        }
        .container {
            height: 75%;
            display: flex;
        }
        nav {
            width: 25%;
            background-color: #f4f4f4;
            border-right: 2px solid #000;
            padding: 15px;
        }
        main {
            width: 75%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            height: 10%;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border-top: 2px solid #000;
        }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 12px; }
        a { color: #002d62; font-weight: bold; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>ABC COLLEGE</h1>
    </header>

    <div class="container">
        <nav>
            <h3>MENU FRAME</h3>
            <ul>
                <li><a href="home.html" target="content_iframe">Home</a></li>
                <li><a href="courses.html" target="content_iframe">Courses</a></li>
                <li><a href="departments.html" target="content_iframe">Departments</a></li>
                <li><a href="contact.html" target="content_iframe">Contact</a></li>
            </ul>
        </nav>

        <main>
            <iframe src="home.html" name="content_iframe"></iframe>
        </main>
    </div>

    <footer>
        <p>Copyright &copy; 2026 ABC College. All rights reserved.</p>
    </footer>

</body>
</html>
